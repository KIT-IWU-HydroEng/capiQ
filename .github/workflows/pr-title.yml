# Organization-wide check, defined in https://github.com/KIT-IWU-HydroEng/.github
name: PR title

# pull_request_target also works for pull requests from forks. It is safe here because
# the check only reads the pull request title and never checks out its code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    uses: KIT-IWU-HydroEng/.github/.github/workflows/reusable-pr-title.yml@main
