# ─────────────────────────────────────────────────────────────────────────────
# Documentation: builds the site in docs/ with Zensical and publishes it to
# GitHub Pages (https://kit-iwu-hydroeng.github.io/capiQ/).
#
#   build   every pull request and every push to main: a warning (broken link,
#           missing example file) fails the check
#   deploy  pushes to main only: shows up as the github-pages deployment
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions
# ─────────────────────────────────────────────────────────────────────────────

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests: cancel superseded builds. main: never cancel a running deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      # Run from the project root: the pages include example files relative to it
      - run: uv run --locked --only-group dev zensical build -f docs/zensical.toml --clean --strict
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The url makes the repository's sidebar show the deployment and link to the site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
