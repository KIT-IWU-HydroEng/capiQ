# ─────────────────────────────────────────────────────────────────────────────
# Python CI, based on https://github.com/KIT-IWU-HydroEng/python-template
# (without the test job: tests do not apply to this repository)
# Environments are managed with uv and resolved from uv.lock.
#
#   lint
#   typecheck
#   security
#   dependency-audit
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Ruff: lint and formatting (and an up-to-date uv.lock) ─────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      # Fails if uv.lock does not match pyproject.toml
      - run: uv lock --check
      # The github output format shows findings inline on the pull request
      - run: uv run --only-group dev ruff check . --output-format=github
      - run: uv run --only-group dev ruff format --check --diff .

  # ── mypy: static type checking ─────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked mypy

  # ── Bandit: common security issues in the code ─────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      # -ll: report medium and high severity only
      - run: uv run --locked --only-group dev bandit -r src -ll

  # ── pip-audit: known vulnerabilities in dependencies ───────────────────────
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      # Audits the runtime dependency versions pinned in uv.lock
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt
      - run: uv run --locked --only-group dev pip-audit -r requirements-audit.txt --require-hashes --disable-pip
